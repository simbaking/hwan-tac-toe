<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            margin-top: 50px;
        }
        h1 { margin-bottom: 10px; }
        .info {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            min-height: 30px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
            background: #34495e;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .cell {
            width: 100px;
            height: 100px;
            background: #ecf0f1;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 64px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            user-select: none;
            transition: background 0.2s;
        }
        .cell:hover {
            background: #bdc3c7;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            align-items: center;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.2s;
            height: 50px;
        }
        button:hover {
            background-color: #c0392b;
        }
        .toggle-btn {
            background-color: #7f8c8d;
        }
        .toggle-btn:hover {
            background-color: #95a5a6;
        }
        .ai-settings {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #34495e;
            padding: 0 15px;
            border-radius: 5px;
            height: 50px;
            box-sizing: border-box;
        }
        .ai-settings label {
            margin-bottom: 2px;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div class="info" id="info">Loading...</div>
    <div class="board" id="board">
        <!-- Cells generated by JS -->
    </div>
    <div class="controls">
        <button id="aiToggleBtn" class="toggle-btn" onclick="toggleAI()">Computer Player: OFF</button>
        <div id="aiDifficulty" class="ai-settings">
            <label for="aiSlider">Difficulty: <span id="difficultyLabel">100%</span></label>
            <input type="range" id="aiSlider" min="0" max="100" step="10" value="100" oninput="updateDifficulty(this.value)">
        </div>
        <button onclick="resetGame()">Restart Game</button>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const infoEl = document.getElementById('info');
        let aiEnabled = false;
        let currentData = null;
        let isComputerThinking = false;
        
        function toggleAI() {
            aiEnabled = !aiEnabled;
            const btn = document.getElementById('aiToggleBtn');
            const diffContainer = document.getElementById('aiDifficulty');
            btn.innerText = aiEnabled ? "Computer Player: ON" : "Computer Player: OFF";
            btn.style.backgroundColor = aiEnabled ? "#27ae60" : "#7f8c8d";
            diffContainer.style.display = aiEnabled ? "flex" : "none";
            
            if (aiEnabled && currentData && currentData.currentPlayer === 'O' && !currentData.winner && !currentData.draw && !isComputerThinking) {
                isComputerThinking = true;
                setTimeout(() => makeComputerMove(currentData.board), 300);
            }
        }
        
        function updateDifficulty(val) {
            document.getElementById('difficultyLabel').innerText = val + '%';
        }

        // Initialize board UI
        for(let i=0; i<9; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.onclick = () => userMove(i);
            boardEl.appendChild(cell);
        }

        async function fetchState() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                updateUI(data);
            } catch(e) {
                console.error("Failed to fetch state:", e);
            }
        }

        function updateUI(data) {
            currentData = data;
            const cells = boardEl.children;
            for(let i=0; i<9; i++) {
                cells[i].innerText = data.board[i] || '';
                if(data.board[i] === 'X') {
                    cells[i].style.color = '#e74c3c';
                } else if(data.board[i] === 'O') {
                    cells[i].style.color = '#3498db';
                }
            }
            if(data.winner) {
                infoEl.innerText = `Player ${data.winner} Wins! 🎉`;
                isComputerThinking = false;
            } else if(data.draw) {
                infoEl.innerText = `It's a Draw! 🤝`;
                isComputerThinking = false;
            } else {
                infoEl.innerText = `Player ${data.currentPlayer}'s Turn`;
                if (aiEnabled && data.currentPlayer === 'O' && !isComputerThinking) {
                    isComputerThinking = true;
                    setTimeout(() => makeComputerMove(data.board), 300);
                } else {
                    if (data.currentPlayer === 'X') {
                        isComputerThinking = false;
                    }
                }
            }
        }

        async function userMove(pos) {
            if (currentData && currentData.winner) return;
            if (aiEnabled && currentData && currentData.currentPlayer === 'O') return;
            if (currentData && currentData.board[pos]) return;
            await makeMove(pos);
        }

        async function makeMove(pos) {
            await fetch(`/api/move?pos=${pos}`);
            fetchState();
        }

        function checkWin(board) {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let line of lines) {
                if (board[line[0]] && board[line[0]] === board[line[1]] && board[line[0]] === board[line[2]]) {
                    return board[line[0]];
                }
            }
            return null;
        }

        function minimax(board, depth, isMaximizing) {
            let result = checkWin(board);
            if (result === 'O') return 10 - depth;
            if (result === 'X') return -10 + depth;
            
            let isDraw = true;
            for (let i = 0; i < 9; i++) {
                if (!board[i]) isDraw = false;
            }
            if (isDraw) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (!board[i]) {
                        board[i] = 'O';
                        let score = minimax(board, depth + 1, false);
                        board[i] = null;
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (!board[i]) {
                        board[i] = 'X';
                        let score = minimax(board, depth + 1, true);
                        board[i] = null;
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function makeComputerMove(board) {
            let move = -1;
            const difficulty = parseInt(document.getElementById('aiSlider').value, 10);
            const useMinimax = (Math.random() * 100) < difficulty;

            let availableMoves = [];
            for (let i = 0; i < 9; i++) {
                if (!board[i]) availableMoves.push(i);
            }

            if (useMinimax) {
                let bestScore = -Infinity;
                let boardCopy = [...board];
                for (let i = 0; i < 9; i++) {
                    if (!boardCopy[i]) {
                        boardCopy[i] = 'O';
                        let score = minimax(boardCopy, 0, false);
                        boardCopy[i] = null;
                        if (score > bestScore) {
                            bestScore = score;
                            move = i;
                        }
                    }
                }
            } else {
                if (availableMoves.length > 0) {
                    const randomIndex = Math.floor(Math.random() * availableMoves.length);
                    move = availableMoves[randomIndex];
                }
            }
            
            if (move !== -1) {
                makeMove(move);
            }
        }

        async function resetGame() {
            isComputerThinking = false;
            let starting = 'X';
            if (aiEnabled && Math.random() < 0.5) {
                starting = 'O';
            }
            await fetch(`/api/reset?starting=${starting}`);
            fetchState();
        }

        fetchState();
    </script>
</body>
</html>
