<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            margin-top: 50px;
        }
        h1 { margin-bottom: 10px; }
        .info {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            min-height: 30px;
        }
        .board {
            display: grid;
            gap: 10px;
            background: #34495e;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            width: 340px;
            height: 340px;
            box-sizing: border-box;
        }
        .cell {
            background: #ecf0f1;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            user-select: none;
            transition: background 0.2s;
        }
        .cell:hover {
            background: #bdc3c7;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }
        button, select, input[type=number] {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.2s;
            height: 50px;
            box-sizing: border-box;
        }
        button:hover, select:hover {
            background-color: #c0392b;
        }
        .toggle-btn {
            background-color: #7f8c8d;
        }
        .toggle-btn:hover {
            background-color: #95a5a6;
        }
        .settings-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #34495e;
            padding: 10px;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .settings-box label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        select, input[type=number] {
            background-color: #2c3e50;
            border: 2px solid #34495e;
            padding: 0 10px;
        }
        input[type=number] {
            width: 60px;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div class="info" id="info">Loading...</div>
    <div class="board" id="board">
        <!-- Cells generated by JS -->
    </div>
    <div class="controls">
        <div class="settings-box">
            <label for="boardSize">Board Size:</label>
            <select id="boardSize" onchange="changeSize()">
                <option value="1">1x1</option>
                <option value="2">2x2</option>
                <option value="3" selected>3x3</option>
                <option value="4">4x4</option>
                <option value="5">5x5</option>
            </select>
        </div>
        
        <div class="settings-box">
            <label>Win Amount (Handicap)</label>
            <div class="flex-row">
                <label for="xHandicap" style="color: #e74c3c">X:</label>
                <input type="number" id="xHandicap" value="3" min="1" max="5" onchange="changeSize()">
                <label for="oHandicap" style="color: #3498db">O:</label>
                <input type="number" id="oHandicap" value="3" min="1" max="5" onchange="changeSize()">
            </div>
        </div>

        <div class="settings-box">
            <label>AI Mode</label>
            <button id="aiToggleBtn" class="toggle-btn" onclick="toggleAI()">OFF</button>
        </div>
        
        <div class="settings-box">
            <label>Blocks (Max 3)</label>
            <div class="flex-row">
                <label for="xBlocks" style="color: #e74c3c">X:</label>
                <input type="number" id="xBlocks" value="0" min="0" max="3" onchange="changeSize()">
                <label for="oBlocks" style="color: #3498db">O:</label>
                <input type="number" id="oBlocks" value="0" min="0" max="3" onchange="changeSize()">
            </div>
        </div>

        <div class="settings-box" id="blockModeBox" style="display: none;">
            <label>Use Block Mode</label>
            <button id="blockToggleBtn" class="toggle-btn" onclick="toggleBlockMode()">OFF</button>
        </div>
        
        <div id="aiDifficulty" class="settings-box" style="display: none;">
            <label for="aiSlider">AI Difficulty: <span id="difficultyLabel">100%</span></label>
            <input type="range" id="aiSlider" min="0" max="100" step="10" value="100" oninput="updateDifficulty(this.value)">
        </div>

        <div class="settings-box">
            <label>&nbsp;</label>
            <button onclick="resetGame()">Restart Game</button>
        </div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const infoEl = document.getElementById('info');
        let aiEnabled = false;
        let blockModeEnabled = false;
        let currentData = null;
        let isComputerThinking = false;
        
        function toggleBlockMode() {
            blockModeEnabled = !blockModeEnabled;
            const btn = document.getElementById('blockToggleBtn');
            btn.innerText = blockModeEnabled ? "ON" : "OFF";
            btn.style.backgroundColor = blockModeEnabled ? "#f39c12" : "#7f8c8d";
        }

        function toggleAI() {
            aiEnabled = !aiEnabled;
            const btn = document.getElementById('aiToggleBtn');
            const diffContainer = document.getElementById('aiDifficulty');
            btn.innerText = aiEnabled ? "ON" : "OFF";
            btn.style.backgroundColor = aiEnabled ? "#27ae60" : "#7f8c8d";
            diffContainer.style.display = aiEnabled ? "flex" : "none";
            
            if (aiEnabled && currentData && currentData.currentPlayer === 'O' && !currentData.winner && !currentData.draw && !isComputerThinking) {
                isComputerThinking = true;
                setTimeout(() => makeComputerMove(currentData.board, currentData.boardSize, currentData.xHandicap, currentData.oHandicap), 300);
            }
        }
        
        function updateDifficulty(val) {
            document.getElementById('difficultyLabel').innerText = val + '%';
        }

        async function fetchState() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                updateUI(data);
            } catch(e) {
                console.error("Failed to fetch state:", e);
            }
        }

        function updateUI(data) {
            currentData = data;
            const size = data.boardSize || 3;
            
            // Rebuild board if size changed or first load
            if (boardEl.children.length !== size * size) {
                boardEl.innerHTML = '';
                boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
                boardEl.style.gridTemplateRows = `repeat(${size}, 1fr)`;
                
                const gapSize = size > 3 ? 5 : 10;
                boardEl.style.gap = `${gapSize}px`;
                
                const fontSize = size === 1 ? 120 :
                                 size === 2 ? 80 :
                                 size === 3 ? 64 :
                                 size === 4 ? 48 : 36;

                for(let i=0; i<size*size; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.fontSize = `${fontSize}px`;
                    cell.onclick = () => userMove(i);
                    boardEl.appendChild(cell);
                }
                document.getElementById('boardSize').value = size;
                document.getElementById('xHandicap').value = data.xHandicap;
                document.getElementById('oHandicap').value = data.oHandicap;
                document.getElementById('xBlocks').value = data.xBlocks !== undefined ? data.xBlocks : 0;
                document.getElementById('oBlocks').value = data.oBlocks !== undefined ? data.oBlocks : 0;
            }

            let blocksLeft = data.currentPlayer === 'X' ? data.xBlocks : data.oBlocks;
            const blockModeBox = document.getElementById('blockModeBox');
            if (blocksLeft > 0 && !data.winner && !data.draw && !(aiEnabled && data.currentPlayer === 'O')) {
                blockModeBox.style.display = 'flex';
                let txt = blockModeEnabled ? "ON" : "OFF";
                document.getElementById('blockToggleBtn').innerText = txt + " (" + blocksLeft + " left)";
            } else {
                blockModeBox.style.display = 'none';
                if (blockModeEnabled) toggleBlockMode();
            }

            const cells = boardEl.children;
            for(let i=0; i<size*size; i++) {
                if (data.board[i] === 'B') {
                    cells[i].innerText = '⬛';
                    cells[i].style.color = '#7f8c8d';
                } else {
                    cells[i].innerText = data.board[i] || '';
                    if(data.board[i] === 'X') {
                        cells[i].style.color = '#e74c3c';
                    } else if(data.board[i] === 'O') {
                        cells[i].style.color = '#3498db';
                    }
                }
            }
            if(data.winner) {
                infoEl.innerText = `Player ${data.winner} Wins! 🎉`;
                isComputerThinking = false;
            } else if(data.draw) {
                infoEl.innerText = `It's a Draw! 🤝`;
                isComputerThinking = false;
            } else {
                infoEl.innerText = `Player ${data.currentPlayer}'s Turn`;
                if (aiEnabled && data.currentPlayer === 'O' && !isComputerThinking) {
                    isComputerThinking = true;
                    setTimeout(() => makeComputerMove(data.board, size, data.xHandicap, data.oHandicap), 300);
                } else {
                    if (data.currentPlayer === 'X') {
                        isComputerThinking = false;
                    }
                }
            }
        }

        async function userMove(pos) {
            if (currentData && currentData.winner) return;
            if (aiEnabled && currentData && currentData.currentPlayer === 'O') return;
            if (currentData && currentData.board[pos]) return;
            if (blockModeEnabled) {
                await fetch(`/api/block?pos=${pos}`);
                let blocksLeft = currentData.currentPlayer === 'X' ? currentData.xBlocks : currentData.oBlocks;
                if (blocksLeft <= 1) {
                    if (blockModeEnabled) toggleBlockMode();
                }
                fetchState();
            } else {
                await makeMove(pos);
            }
        }

        async function makeMove(pos) {
            await fetch(`/api/move?pos=${pos}`);
            fetchState();
        }

        let tt = new Map();
        const EXACT = 0, LOWERBOUND = 1, UPPERBOUND = 2;
        let globalWinMasks = {};
        let symmetriesCache = {};

        function getSymmetries(size) {
            if (symmetriesCache[size]) return symmetriesCache[size];
            let syms = [];
            for (let i = 0; i < 8; i++) syms.push(new Array(size * size));
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    let i = r * size + c;
                    syms[0][i] = r * size + c;
                    syms[1][i] = c * size + (size - 1 - r);
                    syms[2][i] = (size - 1 - r) * size + (size - 1 - c);
                    syms[3][i] = (size - 1 - c) * size + r;
                    syms[4][i] = r * size + (size - 1 - c);
                    syms[5][i] = (size - 1 - r) * size + c;
                    syms[6][i] = c * size + r;
                    syms[7][i] = (size - 1 - c) * size + (size - 1 - r);
                }
            }
            symmetriesCache[size] = syms;
            return syms;
        }

        function getCanonicalKey(xBoard, oBoard, bBoard, size, isMax, xbl, obl) {
            let syms = getSymmetries(size);
            let minNx = xBoard, minNo = oBoard, minNb = bBoard;
            
            for (let k = 1; k < 8; k++) {
                let sym = syms[k];
                let nx = 0, no = 0, nb = 0;
                
                let temp = xBoard;
                while (temp > 0) {
                    let bit = temp & -temp;
                    nx |= (1 << sym[31 - Math.clz32(bit)]);
                    temp &= temp - 1;
                }
                temp = oBoard;
                while (temp > 0) {
                    let bit = temp & -temp;
                    no |= (1 << sym[31 - Math.clz32(bit)]);
                    temp &= temp - 1;
                }
                temp = bBoard;
                while (temp > 0) {
                    let bit = temp & -temp;
                    nb |= (1 << sym[31 - Math.clz32(bit)]);
                    temp &= temp - 1;
                }

                if (nx < minNx) {
                    minNx = nx; minNo = no; minNb = nb;
                } else if (nx === minNx) {
                    if (no < minNo) {
                        minNo = no; minNb = nb;
                    } else if (no === minNo) {
                        if (nb < minNb) {
                            minNb = nb;
                        }
                    }
                }
            }
            return minNx + '_' + minNo + '_' + minNb + '_' + isMax + '_' + xbl + '_' + obl;
        }

        function getWinMasks(size, hc) {
            let key = size + '_' + hc;
            if (globalWinMasks[key]) return globalWinMasks[key];
            let masks = [];
            const dirs = [[0, 1], [1, 0], [1, 1], [-1, 1]];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    for (let [dr, dc] of dirs) {
                        let mask = 0;
                        let valid = true;
                        for (let step = 0; step < hc; step++) {
                            let nr = r + dr * step;
                            let nc = c + dc * step;
                            if (nr >= 0 && nr < size && nc >= 0 && nc < size) {
                                mask |= (1 << (nr * size + nc));
                            } else {
                                valid = false;
                                break;
                            }
                        }
                        if (valid) masks.push(mask);
                    }
                }
            }
            globalWinMasks[key] = masks;
            return masks;
        }

        function checkWinBitboard(boardBits, masks) {
            for (let i = 0; i < masks.length; i++) {
                if ((boardBits & masks[i]) === masks[i]) return true;
            }
            return false;
        }

        function minimaxOptimized(xBoard, oBoard, bBoard, size, depth, isMaximizing, alpha, beta, xWinMasks, oWinMasks, xbl, obl) {
            let origAlpha = alpha;
            let key = getCanonicalKey(xBoard, oBoard, bBoard, size, isMaximizing, xbl, obl);
            let entry = tt.get(key);
            if (entry) {
                window.ttHits = (window.ttHits || 0) + 1;
                let score = entry.score;
                if (score > 50) score -= depth;
                else if (score < -50) score += depth;
                
                if (entry.flag === EXACT) return score;
                if (entry.flag === LOWERBOUND) alpha = Math.max(alpha, score);
                else if (entry.flag === UPPERBOUND) beta = Math.min(beta, score);
                if (alpha >= beta) return score;
            } else {
                window.ttMisses = (window.ttMisses || 0) + 1;
            }

            if (checkWinBitboard(oBoard, oWinMasks)) return 100 - depth;
            if (checkWinBitboard(xBoard, xWinMasks)) return -100 + depth;
            
            let fullMask = (1 << (size * size)) - 1;
            if (((xBoard | oBoard | bBoard) & fullMask) === fullMask) return 0;

            let availableMoves = [];
            for (let i = 0; i < size * size; i++) {
                if (!((xBoard | oBoard | bBoard) & (1 << i))) {
                    availableMoves.push(i);
                }
            }

            availableMoves.sort((a, b) => {
                let scoreA = 0, scoreB = 0;
                let bitA = 1 << a, bitB = 1 << b;
                if (isMaximizing) {
                    if (checkWinBitboard(oBoard | bitA, oWinMasks)) scoreA += 1000;
                    if (checkWinBitboard(xBoard | bitA, xWinMasks)) scoreA += 500;
                    if (checkWinBitboard(oBoard | bitB, oWinMasks)) scoreB += 1000;
                    if (checkWinBitboard(xBoard | bitB, xWinMasks)) scoreB += 500;
                } else {
                    if (checkWinBitboard(xBoard | bitA, xWinMasks)) scoreA += 1000;
                    if (checkWinBitboard(oBoard | bitA, oWinMasks)) scoreA += 500;
                    if (checkWinBitboard(xBoard | bitB, xWinMasks)) scoreB += 1000;
                    if (checkWinBitboard(oBoard | bitB, oWinMasks)) scoreB += 500;
                }
                let center = Math.floor(size/2);
                if (Math.floor(a/size) === center && a%size === center) scoreA += 10;
                if (Math.floor(b/size) === center && b%size === center) scoreB += 10;
                return scoreB - scoreA;
            });

            let bestScore = isMaximizing ? -Infinity : Infinity;

            if (isMaximizing) {
                for (let i = 0; i < availableMoves.length; i++) {
                    let move = availableMoves[i];
                    let bit = 1 << move;
                    
                    let score = minimaxOptimized(xBoard, oBoard | bit, bBoard, size, depth + 1, false, alpha, beta, xWinMasks, oWinMasks, xbl, obl);
                    bestScore = Math.max(bestScore, score);
                    alpha = Math.max(alpha, bestScore);
                    if (beta <= alpha) break;

                    if (obl > 0) {
                        let bScore = minimaxOptimized(xBoard, oBoard, bBoard | bit, size, depth + 1, true, alpha, beta, xWinMasks, oWinMasks, xbl, obl - 1);
                        bestScore = Math.max(bestScore, bScore);
                        alpha = Math.max(alpha, bestScore);
                        if (beta <= alpha) break;
                    }
                }
            } else {
                for (let i = 0; i < availableMoves.length; i++) {
                    let move = availableMoves[i];
                    let bit = 1 << move;
                    
                    let score = minimaxOptimized(xBoard | bit, oBoard, bBoard, size, depth + 1, true, alpha, beta, xWinMasks, oWinMasks, xbl, obl);
                    bestScore = Math.min(bestScore, score);
                    beta = Math.min(beta, bestScore);
                    if (beta <= alpha) break;

                    if (xbl > 0) {
                        let bScore = minimaxOptimized(xBoard, oBoard, bBoard | bit, size, depth + 1, false, alpha, beta, xWinMasks, oWinMasks, xbl - 1, obl);
                        bestScore = Math.min(bestScore, bScore);
                        beta = Math.min(beta, bestScore);
                        if (beta <= alpha) break;
                    }
                }
            }

            let ttScore = bestScore;
            if (bestScore > 50) ttScore = bestScore + depth;
            else if (bestScore < -50) ttScore = bestScore - depth;
            
            let flag = EXACT;
            if (bestScore <= origAlpha) flag = UPPERBOUND;
            else if (bestScore >= beta) flag = LOWERBOUND;
            tt.set(key, { score: ttScore, flag: flag });

            return bestScore;
        }

        async function makeComputerMove(board, size, xhc, ohc) {
            let move = -1;
            let useBlock = false;
            const difficulty = parseInt(document.getElementById('aiSlider').value, 10);
            const useMinimax = (Math.random() * 100) < difficulty;

            let xBoard = 0, oBoard = 0, bBoard = 0;
            for (let i = 0; i < size * size; i++) {
                if (board[i] === 'X') xBoard |= (1 << i);
                else if (board[i] === 'O') oBoard |= (1 << i);
                else if (board[i] === 'B') bBoard |= (1 << i);
            }

            let availableMoves = [];
            for (let i = 0; i < size*size; i++) {
                if (!((xBoard | oBoard | bBoard) & (1 << i))) availableMoves.push(i);
            }

            if (useMinimax && availableMoves.length > 0) {
                tt.clear();
                window.ttHits = 0;
                window.ttMisses = 0;
                let xWinMasks = getWinMasks(size, xhc);
                let oWinMasks = getWinMasks(size, ohc);

                availableMoves.sort((a, b) => {
                    let scoreA = 0, scoreB = 0;
                    let bitA = 1 << a, bitB = 1 << b;
                    if (checkWinBitboard(oBoard | bitA, oWinMasks)) scoreA += 1000;
                    if (checkWinBitboard(xBoard | bitA, xWinMasks)) scoreA += 500;
                    if (checkWinBitboard(oBoard | bitB, oWinMasks)) scoreB += 1000;
                    if (checkWinBitboard(xBoard | bitB, xWinMasks)) scoreB += 500;
                    return scoreB - scoreA;
                });

                let bestScore = -Infinity;
                for (let i = 0; i < availableMoves.length; i++) {
                    let m = availableMoves[i];
                    let bit = 1 << m;

                    let score = minimaxOptimized(xBoard, oBoard | bit, bBoard, size, 0, false, bestScore, Infinity, xWinMasks, oWinMasks, currentData.xBlocks, currentData.oBlocks);
                    score += Math.random() * 0.01;
                    if (score > bestScore) {
                        bestScore = score;
                        move = m;
                        useBlock = false;
                    }

                    if (currentData.oBlocks > 0) {
                        let blockScore = minimaxOptimized(xBoard, oBoard, bBoard | bit, size, 0, true, bestScore, Infinity, xWinMasks, oWinMasks, currentData.xBlocks, currentData.oBlocks - 1);
                        blockScore += (Math.random() * 0.01) - 0.02;
                        if (blockScore > bestScore) {
                            bestScore = blockScore;
                            move = m;
                            useBlock = true;
                        }
                    }
                }
                
                console.log(`TT Stats: ${window.ttHits} hits, ${window.ttMisses} misses (unique evaluations), Cache Size: ${tt.size}`);
            }
            
            if (move === -1 && availableMoves.length > 0) {
                const randomIndex = Math.floor(Math.random() * availableMoves.length);
                move = availableMoves[randomIndex];
            }
            
            if (move !== -1) {
                if (useBlock) {
                    isComputerThinking = false; 
                    await fetch(`/api/block?pos=${move}`);
                    fetchState();
                } else {
                    makeMove(move);
                }
            }
        }

        async function changeSize() {
            const size = document.getElementById('boardSize').value;
            const xhc = document.getElementById('xHandicap').value;
            const ohc = document.getElementById('oHandicap').value;
            const xblocks = document.getElementById('xBlocks').value;
            const oblocks = document.getElementById('oBlocks').value;
            document.getElementById('xHandicap').max = size;
            document.getElementById('oHandicap').max = size;
            isComputerThinking = false;
            let starting = 'X';
            if (aiEnabled && Math.random() < 0.5) {
                starting = 'O';
            }
            await fetch(`/api/reset?size=${size}&starting=${starting}&xhc=${xhc}&ohc=${ohc}&xblocks=${xblocks}&oblocks=${oblocks}`);
            fetchState();
        }

        async function resetGame() {
            changeSize();
        }

        fetchState();
    </script>
</body>
</html>
